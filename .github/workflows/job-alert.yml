name: Job Alert

on:
  schedule:
    - cron: "0 13 * * *"  # 9am ET daily (UTC time — adjust as needed)
  workflow_dispatch: {}   # lets you trigger it manually from the Actions tab

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: python check_internships.py
        env:
          DISCORD_WEBHOOK_SOFTWARE: ${{ secrets.DISCORD_WEBHOOK_SOFTWARE }}
          DISCORD_WEBHOOK_AIML: ${{ secrets.DISCORD_WEBHOOK_AIML }}
          DISCORD_WEBHOOK_HARDWARE: ${{ secrets.DISCORD_WEBHOOK_HARDWARE }}
          DISCORD_WEBHOOK_QUANT: ${{ secrets.DISCORD_WEBHOOK_QUANT }}
          DISCORD_WEBHOOK_PRODUCT: ${{ secrets.DISCORD_WEBHOOK_PRODUCT }}

      - name: Commit updated seen_ids.json
        run: |
          git config user.name "job-alert-bot"
          git config user.email "actions@github.com"
          git add seen_ids.json
          git diff --staged --quiet || git commit -m "Update seen listings"
          git push